<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background: #f4f4f4;
    }

    header {
      background: #333;
      color: white;
      padding: 20px;
      text-align: center;
    }

    nav {
      margin-top: 10px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
    }

    nav a:hover {
      color: #4facfe;
    }

    .hero {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      color: white;
    }

    .hero h1 {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 1.2rem;
      margin-bottom: 25px;
    }

    .button {
      display: inline-block;
      padding: 12px 25px;
      background: white;
      color: #1687d9;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }

    .button:hover {
      background: #eee;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #222;
      color: white;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 2.2rem;
      }
    }
  </style>
</head>

<body>

  <header>
    <h2>My Website</h2>

    <nav>
      <a href="#">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Welcome to My Website</h1>
      <p>A simple and modern HTML website.</p>
      <a href="#about" class="button">Learn More</a>
    </section>

    <section id="about" style="padding: 60px 20px; text-align: center;">
      <h2>About Us</h2>
      <p style="margin-top: 15px;">
        This is a basic website built using HTML and CSS.
      </p>
    </section>
  </main>

  <footer id="contact">
    <p>&copy; 2026 My Website. All rights reserved.</p>
  </footer>

</body>
</html>
